version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/ui/desktop"]
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui/desktop/frontend
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint 8 supports TypeScript up to 6; upgrade both together.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
