version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/ui/desktop"]
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui/desktop/frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
